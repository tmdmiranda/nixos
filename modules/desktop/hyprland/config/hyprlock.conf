general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}
background {
    monitor =
    path = /home/tiago/.config/hypr/images/hyprlock.png # This tells it to use a blurred screenshot of your current screen
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 1 # 0 disables blurring
}
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    dots_size = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(187, 0, 204, 0.5) # Your purple with transparency
    inner_color = rgba(30, 30, 46, 0.5) # Dark transparent background
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    rounding = 0 # Full circle
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    position = 400, 0
    halign = left
    valign = center
}
# TIME
label {
    monitor =
    text = $TIME
    color = rgba(221, 206, 245, 1.0)
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 0
    halign = center
    valign = top
}

# USER
label {
    monitor =
    text = Hi there, $USER
    color = rgba(221, 206, 245, 1.0)
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, 0
    halign = center
    valign = bottom
}
# USER PFP
image {
    monitor =
    path = /home/tiago/.config/hypr/images/hyprpfp.png
    size = 300
    rounding = -1 
    border_size = 2
    border_color = rgb(bb00cc)
    position = 50,0
    halign = left
    valign = center
}
